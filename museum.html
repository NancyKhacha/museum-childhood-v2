<noscript><div class="load-error">Для прогулки по музею включите JavaScript. <a href="index.html?v=20261124-v2t#story">Вернуться к рассказу о проекте</a></div><!-- museum-text:start --><article class="museum-text" aria-label="Музей детства"><h1>Музей детства</h1><section class="museum-text-era" id="era-0"><h2>1964–80-е</h2><p>Тогда телевизор нельзя было поставить на паузу, сказки слушали на пластинках, а для диафильма нужно было затемнить комнату и найти свободную стену — желательно без слишком веселого рисунка на обоях. Игрушки переходили от старших к младшим, их чинили и берегли. А любимую передачу можно было посмотреть только в тот момент, когда она шла по телевизору: если опоздал — значит, пропустил.</p><figure class="museum-text-expert"><figcaption><h3>Анна Гребенникова</h3><p>Историк, социальный антрополог</p></figcaption><blockquote><p>Для этого периода ключевыми были ценность предмета и ритуалы вокруг него. Проигрыватель или фильмоскоп нельзя было просто заменить, а пользование ими требовало последовательности действий: затемнить комнату, подготовить стену, перевернуть пластинку. Такие ритуалы прочно закрепляются в памяти.</p><p>В условиях дефицита даже недорогую игрушку нужно было найти, успеть купить или выменять. Вокруг вещей неизбежно складывались семейные и детские социальные практики.</p></blockquote></figure><figure class="museum-text-expert"><figcaption><h3>Наталья Кисельникова</h3><p>Кандидат психологических наук</p></figcaption><blockquote><p>Это детство, устроенное вокруг расписания. Выбора было мало, зато все было понятно и предсказуемо: ребенок точно знал, что будет смотреть “Спокойной ночи, малыши!” вечером. При этом передача заканчивалась сама, не требуя ни от кого решения выключить экран. Опыт, недоступный современным детям.</p><p>Второе свойство детства этой эпохи — много свободного времени без надзора взрослых. Самостоятельная игра во дворе учит отстаивать свое, уступать и договариваться. Такой опыт сложно получить на организованном занятии.</p></blockquote></figure><section class="museum-text-object"><h3>Фильмоскоп</h3><p>Фильмоскоп — это маленький домашний проектор для диафильмов: длинной пленки с последовательностью неподвижных картинок и текстом. Комнату затемняли, изображение выводили на белую стену или простыню, а кадры прокручивали вручную. Один человек мог крутить пленку, другой — читать вслух подписи, поэтому просмотр легко превращался в домашний спектакль.</p></section><section class="museum-text-object"><h3>Виниловая пластинка</h3><p>Детская пластинка могла быть вполне взрослой постановкой. Для знаменитой «Алисы в Стране чудес» 1976 года Владимир Высоцкий написал больше двадцати песен и сам исполнил несколько персонажей. Сказка заняла две большие пластинки, а часть написанных песен пришлось сократить: на виниле буквально не хватило места.</p></section><section class="museum-text-object"><h3>Телевизор с поворотной ручкой</h3><p>На многих советских телевизорах ручка переключалась между 12 каналами. Звучит роскошно, если помнить, что программ у большинства зрителей было две-три. Но двенадцать положений нужны были не для двенадцати передач: телевизионные центры вещали на разных частотах, чтобы сигналы соседних вышек не мешали друг другу.</p></section><section class="museum-text-object"><h3>Неваляшка</h3><p>Одну из самых популярных советских игрушек массово выпускали на Тамбовском пороховом заводе. Первые модели делали из целлулоида — материала, связанного с производством пороха. В 1958 году завод выпустил 120 тысяч неваляшек, а уже через два года — 1,2 миллиона. Игрушки отправляли даже на экспорт.</p></section><section class="museum-text-object"><h3>Металлический конструктор</h3><p>В коробке были планки с дырочками, винты, гайки, маленький гаечный ключ — и инструкция, которая прекрасно передает дух эпохи. Владельцам конструктора «Юность» прямо советовали: если деталей не хватает, сделайте их сами из картона, фанеры или жести. Конструктор предполагал, что ребенок в какой-то момент перестанет следовать инструкции.</p></section><section class="museum-text-object"><h3>Электронная игра «Ну, погоди!»</h3><p>Главная школьная легенда вокруг «Электроники ИМ-02»: если набрать тысячу очков, игра покажет секретный мультфильм. Кто-то обязательно знал человека, который якобы его видел. На самом деле экран технически не мог показывать ничего, кроме заранее заданных элементов. После 999 очков счет просто начинался заново — уже на высокой скорости. Но это никак не сказалось на ее популярности среди детей.</p></section><section class="museum-text-object"><h3>Кубик Рубика</h3><p>Кубик Рубика добрался до СССР в начале 1980-х и устроил настоящую кубикоманию. В 1982 году журнал «Наука и жизнь» напечатал подробный способ сборки — тираж номера составлял около трех миллионов экземпляров. В школах устраивали свои соревнования на скорость, а за самими кубиками часами стояли в очередях.</p></section><section class="museum-text-object"><h3>Кассетный магнитофон</h3><p>Кассетник в 1980-е можно было вынести из квартиры: во двор, на пикник, в школьную поездку. Но куда важнее было другое — кассеты можно было переписывать. Музыка переходила от человека к человеку независимо от магазинов и фирмы «Мелодия». А в фильме «Вам и не снилось...» подростки даже отправляли друг другу аудиописьма на кассетах. Голосовое сообщение образца 1980 года.</p></section><section class="museum-text-object"><h3>Значки</h3><p>Значки были одновременно украшением, коллекцией, поводом для гордости и обмена. Олимпиада-80 особенно разогнала этот тренд: тогда выпускались целые серии с Мишкой, видами спорта, городами и эмблемами. Один обычный сувенирный олимпийский значок мог стоить 30 копеек — поэтому коллекцию вполне мог собирать и школьник, а не только взрослый коллекционер.</p></section><section class="museum-text-programme"><h3>«Спокойной ночи, малыши!»</h3><p>Один из самых узнаваемых советских телевизионных ритуалов начался с поездки в ГДР. В 1963 году главный редактор детских программ Центрального телевидения Валентина Федотова увидела там мультсериал про песочного человечка, который каждый вечер укладывал детей спать, и предложила сделать свою вечернюю передачу для детей в СССР. Название нашли буквально накануне первого эфира: среди вариантов были «Вечерняя сказка», «Сказка на ночь» и даже «В гостях у волшебного человечка Тик-Так» — но выбор пал на знакомое каждому ребенку название.</p><p>1 сентября 1964 года в 20:29 начался первый выпуск. Он длился всего семь минут и совсем не был похож на те «Спокойной ночи, малыши!», которые мы знаем: на экране сменялись черно-белые картинки, а историю рассказывал голос за кадром. В конце 1964 года впервые прозвучала колыбельная «Спят усталые игрушки».</p><p>Ведущих детям представляли по-домашнему. Владимир Ухин пришел в программу в 1964 году и оставался дядей Володей 31 год. Валентина Леонтьева стала тетей Валей — никаких фамилий ребенку знать не требовалось. Кукольная компания тоже собиралась постепенно. Главным старожилом оказался Филя: будущего героя в 1967 году нашли на кукольном складе — тогда пес еще звался Бравни. Днем рождения Фили считается 20 мая 1968 года. Степашка пришел в 1970-м, Хрюша — в 1971-м, а Каркуша присоединилась к компании только в 1982-м.</p><p>В том же 1982 году появилась заставка, которую сегодня узнают с первых секунд: пластилиновый мультфильм Александра Татарского. Автором самой заставки был Эдуард Успенский, Татарский выступил художником и режиссером, а Зоя Петрова специально дописала новый куплет к «Спят усталые игрушки». Существовала целая недельная версия заставки: в понедельник перед телевизором сидела одна девочка, затем к ней каждый день присоединялась еще одна игрушка, а к воскресенью у экрана собиралась уже целая компания.</p><p>Еще из интересного: в 1988 году Хрюша вышел в международный эфир — он участвовал в советско-американском телемосте Free to Be… a Family. Среди американских участников были Робин Уильямс, Джон Бон Джови и маппеты — Кермит, мисс Пигги, Элмо и другие герои. Совместный спецвыпуск ABC и советского телевидения в 1989 году получил «Эмми» как лучшая детская программа.</p><p><a href="https://vkvideo.ru/playlist/-113057035_11" rel="noopener noreferrer">Смотрите «Спокойной ночи, малыши! Ждут друзей» в VK Видео</a></p></section></section><section class="museum-text-era" id="era-1"><h2>1990-е</h2><p>Пока взрослые пытались привыкнуть к новой реальности, ценам и правилам жизни, детский мир стремительно менялся. Во дворах все еще пропадали до темноты, но, если были дома, то уже играли в Dendy и тамагочи, смотрели видеокассеты. Тогда в киосках появились жвачки с вкладышами, на рынках — игрушки, которых раньше никто не видел, а коллекции кэпсов и фантиков обзавелись собственной экономикой: что-то можно было выменять, что-то выиграть, а чем-то — страшно гордиться.</p><figure class="museum-text-expert"><figcaption><h3>Анна Гребенникова</h3><p>Историк, социальный антрополог</p></figcaption><blockquote><p>Определяющая черта девяностых — коллекционирование. В нестабильное время коллекция помогала ребенку упорядочить собственный мир. Одновременно в детскую среду пришли рыночные отношения: дети сами устанавливали курс обмена и ценность вещей. Редкая вещь давала статус, но не разъединяла: к владельцу приставки или компьютера шли играть всей компанией.</p></blockquote></figure><figure class="museum-text-expert"><figcaption><h3>Наталья Кисельникова</h3><p>Кандидат психологических наук</p></figcaption><blockquote><p>На детей, выросших в дефиците, обрушилось изобилие, но двор никуда не делся: новое приносили туда, обсуждали и обменивали. Взрослые были поглощены тем, как устроить жизнь, и у детей оставалось много времени без контроля.</p><p>Обмен — это отношения в чистом виде: оценить вещь, договориться, поверить на слово, пережить неудачную сделку. За вкладышами стояла целая экономика с репутацией и представлениями о честности, и дети выстраивали ее сами.</p></blockquote></figure><section class="museum-text-object"><h3>«Система для домашнего видео» (VHS-кассета)</h3><p>Каждая новая копия с другой VHS становилась чуть хуже предыдущей: появлялись полосы, шум, странные цвета. Поэтому фильм, несколько раз переписанный с кассеты на кассету, мог добраться до нового владельца в измененном виде — далеким от режиссерского замысла. А еще именно VHS подарили целому поколению кино с легендарным одноголосым переводом — Терминатор, Рэмбо и герои десятков других фильмов подозрительно часто говорили одним голосом.</p></section><section class="museum-text-object"><h3>Денди (Dendy)</h3><p>Первая партия Dendy приехала в Россию с неподходящим видеостандартом: на части телевизоров приставка показывала черно-белую картинку без звука. Всю партию пришлось вручную перепаивать уже в Москве — вот такой неказистый старт был у легенды поколения. Зато вскоре Dendy стала настолько популярной, что словом «денди» в России начали называть почти любую восьмибитную приставку.</p></section><section class="museum-text-object"><h3>Картридж «9999 игр»</h3><p>Главная обманка детства. На знаменитых многоигровках действительно можно было листать тысячи пунктов меню, только уникальных игр внутри было в разы меньше. Дальше шли повторы — та же игра с другого уровня, с дополнительными жизнями, другим оружием или небольшими изменениями. Что совершенно не мешало добраться до четырехтысячной строчки в надежде, что найдется что-нибудь новое.</p></section><section class="museum-text-object"><h3>Тамагочи</h3><p>Виртуального питомца нужно было кормить, лечить, укладывать спать, развлекать и убирать за ним — причем школьное расписание его совершенно не интересовало. Тамагочи пищал на уроках, дети проверяли его под партой, а школы в разных странах довольно быстро начали запрещать игрушку. Электронное родительство оказалось почти таким же требовательным, как настоящее, только помещалось на брелоке.</p></section><section class="museum-text-object"><h3>Жвачка Love Is… и вкладыши</h3><p>Знаменитые картинки появились раньше самой жвачки. Новозеландка Ким Гроув рисовала маленьких влюбленных на записках для своего будущего мужа. Позже рисунки стали комиксом, а в 1990-е оказались на вкладышах турецкой жвачки Love Is… В России романтическая история быстро превратилась в новый тренд: вкладыши меняли, считали, хранили стопками и охотились за недостающими.</p></section><section class="museum-text-object"><h3>Кэпсы / сотки</h3><p>Игра пришла из США: название POG произошло от напитка Passion fruit, Orange, Guava, картонными крышечками от которого играли на Гавайях. В российских дворах 1990-х фишки называли кэпсами, сотками и просто фишками. У каждой коллекции возникала собственная экономика: редкая картинка могла стоить нескольких обычных, а хорошую стопку можно было собирать месяцами — и проиграть за одну перемену.</p></section><section class="museum-text-object"><h3>Пружинка-радуга</h3><p>Все началось в США в 1943 году, когда инженер Ричард Джеймс, работавший над пружинами для корабельных приборов, случайно уронил одну и увидел, как она «шагает». Через два года первые 400 игрушек раскупили в универмаге меньше чем за два часа. В России 1990-х Slinky превратилась в пластиковую разноцветную «Радугу» — круглую, в форме сердца, звезды или бабочки. Правда, фигурные версии ходили по лестнице заметно хуже.</p></section><section class="museum-text-object"><h3>Лазерная указка с насадками</h3><p>Лазерную указку придумали вовсе не для детей, а для презентаций. Но к концу 1990-х дешевые модели превратились в игрушку: на них накручивали насадки, и вместо обычной красной точки на стене появлялись звездочки, сердечки и другие фигуры. Дальше все развивалось предсказуемо: точки начали бегать по доскам, потолкам, окнам и людям, а школы в разных странах — запрещать указки на уроках.</p></section><section class="museum-text-object"><h3>Дискета</h3><p>На стандартную дискету помещалось 1,44 мегабайта — сегодня этого может не хватить даже на одну фотографию с телефона. А тогда на ней носили документы, школьные работы и небольшие игры с одного компьютера на другой. Сама дискета дошла до наших дней в виде изображения в интерфейсах: ее силуэт до сих пор означает «Сохранить», хотя многие дети никогда не видели предмет своими глазами.</p></section><section class="museum-text-object"><h3>Пейджер</h3><p>Чтобы отправить сообщение на пейджер, нужно было сначала позвонить в пейджинговую компанию, назвать номер абонента и продиктовать текст живому оператору. Оператор набирал сообщение и отправлял его на маленький экран владельца. То есть личная переписка технически предполагала третьего человека, который знал, что именно вы хотите написать. В середине 1990-х это никого не смущало, а наоборот, казалось какой-то невероятной технологией из будущего.</p></section><section class="museum-text-object"><h3>Анкета для друзей</h3><p>Общая тетрадь превращалась в бумажную соцсеть класса. На каждой странице кто-то отвечал на один и тот же набор вопросов: день рождения, любимая группа, цвет, фильм, кем хочешь стать и, конечно, в кого влюблен. Добавлялись наклейки, рисунки, пожелания и секреты. Анкету передавали из рук в руки и потом годами хранили — целый профиль человека задолго до появления профилей в интернете.</p></section><section class="museum-text-programme"><h3>«Спокойной ночи, малыши!»</h3><p>В конце 1991 года, когда вместе со страной перестраивалось и государственное телевидение, «Спокойной ночи, малыши!» оказались под угрозой закрытия: прежнее финансирование фактически исчезло. Ее отстояли зрители: в редакцию пошли письма с просьбами оставить Хрюшу, Степашку, Филю и Каркушу. Уже в 1992-м передача продолжила выходить на 1-м канале Останкино, а в 1997 году получила свою первую ТЭФИ как лучшая детская программа.</p><p>Да и сами «Спокушки» в это десятилетие экспериментировали почти так же отчаянно, как телевидение вокруг. В 1995-м программу некоторое время вел Юрий Куклачев — без привычных кукол, зато со своими кошками. Появился даже Киндерино: герой, связанный с Kinder Surprise, при котором персонажи ели шоколадные яйца и играли с игрушками из них.</p><p><a href="https://vkvideo.ru/playlist/-113057035_11" rel="noopener noreferrer">Смотрите «Спокойной ночи, малыши! Ждут друзей» в VK Видео</a></p></section></section><section class="museum-text-era" id="era-2"><h2>2000-е</h2><p>У детства постепенно появляется все больше артефактов: телефон, MP3-плеер, переписка и профиль ВКонтакте. Фотографии теперь можно посмотреть сразу после съемки, музыку — носить в кармане, а друзей после школы снова встретить вечером в аське или социальной сети. И даже интернет становится менее церемониальным: домашний компьютер все еще один на всех, но подключение к сети уже не обязательно означает, что до вас никто не сможет дозвониться по телефону.</p><figure class="museum-text-expert"><figcaption><h3>Анна Гребенникова</h3><p>Историк, социальный антрополог</p></figcaption><blockquote><p>В двухтысячные пространство ребенка отделяется от пространства взрослых: свой плеер, телефон, своя страница ВКонтакте. Ребенок сам снимает то, что важно ему, собирает свою музыку и оформляет страницу по правилам своего круга.</p><p>Единое детское пространство распадается на множество сообществ по интересам. Предмет остается приметой поколения, но его наполнение становится индивидуальным.</p></blockquote></figure><figure class="museum-text-expert"><figcaption><h3>Наталья Кисельникова</h3><p>Кандидат психологических наук</p></figcaption><blockquote><p>Главный процесс двухтысячных — приватизация медиа. Ребенок впервые получает контент, который выбрал сам и о котором взрослые могут не знать. У него появляется своя территория, но вместе с этим уходит и общий язык со взрослыми.</p><p>Компьютер при этом часто оставался один на всех. Очередь к нему порождала ссоры и обиды, но и вынуждала учиться договариваться.</p></blockquote></figure><section class="museum-text-object"><h3>MP3-плеер</h3><p>Один из первых массовых MP3-плееров Rio PMP300 вмещал всего 32 мегабайта — примерно час музыки. Но звукозаписывающая индустрия увидела в новой штуке такую угрозу, что в 1998 году попыталась через суд вообще остановить продажи: считалось, что карманные MP3-плееры помогут музыкальному пиратству. Суд запрет не поддержал — и решать, какие песни слушать, людям пришлось самостоятельно.</p></section><section class="museum-text-object"><h3>DVD-диск</h3><p>DVD обещал идеальное качество, меню, дополнительные сцены и комментарии режиссера. Но в российских нулевых у него появилась своя версия: пиратские диски «все в одном». В 2005 году на одном DVD могли продавать от двух до десяти фильмов — чем больше, тем сильнее их приходилось сжимать и тем хуже становились картинка и звук. Зато один диск мог обеспечить кино на все выходные.</p></section><section class="museum-text-object"><h3>Телефон с игрой «Змейка»</h3><p>Nokia 3310 вышла в 2000 году с экраном 84 на 48 пикселей и игрой Snake II. Сам телефон разошелся по миру тиражом больше 126 миллионов штук, а «Змейка» превратила мобильник в игровую приставку задолго до магазинов приложений. Ничего не нужно было скачивать: если в кармане была Nokia, игра уже была с тобой.</p></section><section class="museum-text-object"><h3>ИК-порт</h3><p>Чтобы скинуть другу мелодию или картинку, телефоны клали почти нос к носу: инфракрасный порт работал на расстоянии около метра и только в прямой видимости. Стоило дернуть рукой — передача обрывалась, и все начиналось заново. Мелодия на полминуты могла передаваться дольше, чем длилась перемена. Потом на смену пришел Bluetooth, и «скинь по блютусу» стало главной фразой школьных коридоров.</p></section><section class="museum-text-object"><h3>ICQ</h3><p>ICQ расшифровывается как I seek you — «я ищу тебя». Вместо привычного логина каждому выдавали номер UIN, который многие знали наизусть, а звук входящего сообщения «о-оу!» многие помнят до сих пор. В России аська стала настолько популярной, что в 2005 году появился отдельный Rambler-ICQ, а уже к 2008-му ICQ пользовались около шести миллионов россиян в месяц.</p></section><section class="museum-text-object"><h3>Цифровая мыльница</h3><p>Одна из первых цифровых камер с экраном снимала фотографии размером всего 320 на 240 пикселей. Зато кадр впервые можно было посмотреть сразу — и удалить, если вдруг не понравился. В нулевые цифровая мыльница стала главным поставщиком сотен слегка смазанных фотографий с дней рождения, прогулок, поездок и школьных вечеринок, которые потом целыми альбомами отправлялись во ВКонтакте.</p></section><section class="museum-text-object"><h3>Скейтборд</h3><p>В начале нулевых российский скейтбординг окончательно вышел из дворового андеграунда. В Москве открылся крытый парк «Адреналин» площадью около 7,5 тысячи квадратных метров — его называли крупнейшим в Европе, а в выходные там катались до тысячи человек в день. Скейт становился уже не просто доской с колесами, а целой культурой со своей музыкой, одеждой и местами встречи.</p></section><section class="museum-text-object"><h3>«Смешарики»</h3><p>Круглых зверей из Ромашковой долины первыми увидели зрители «Спокойной ночи, малыши!»: в 2003–2004 годах премьерные серии показывали прямо в передаче. Художник Салават Шайхинуров сделал героев круглыми нарочно — чтобы любой ребенок мог сам нарисовать Кроша или Нюшу. Злодеев во вселенной «Смешариков» не было вообще: сюжеты строятся не на битве хороших с плохими, а на том, как договориться. А в 2008 году авторы сериала получили Государственную премию.</p></section><section class="museum-text-object"><h3>Флешка</h3><p>Первые USB-флешки появились в 2000 году и вмещали около 8 мегабайт. После дискеты это казалось практически безграничным пространством. В нулевые флешки поселились в пеналах, на ключах и шнурках: на них носили рефераты, презентации, фотографии и музыку — а фраза «скинь на флешку» стала обыденностью.</p></section><section class="museum-text-object"><h3>ВКонтакте</h3><p>Сначала соцсеть предполагалась для ограниченного круга студентов, но уже в конце 2006 года регистрацию открыли для всех — и ВКонтакте быстро переехал из университетов в школы. Стена стала анкетой для друзей в прямом эфире: на ней поздравляли, оставляли «сигны», а с 2007 года рисовали граффити. В том же году появились аудиозаписи, и страница превратилась еще и в личную музыкальную коллекцию. Тогда плейлист ВКонтакте говорил о человеке не меньше, чем статус.</p></section><section class="museum-text-object"><h3>Первые смартфоны</h3><p>Первый iPhone вышел в 2007 году, но официально в России его вообще не продавали. Это почти никого не остановило: к моменту официального запуска iPhone 3G осенью 2008-го у россиян уже было, по разным оценкам, от 100 до 400 тысяч серых айфонов, привезенных из-за границы. Получилась классическая для той эпохи история: телефон официально еще не приехал, а рынок по его сбыту уже процветал.</p></section><section class="museum-text-object"><h3>Angry Birds</h3><p>Angry Birds вышла в самом конце нулевых — в декабре 2009 года. Суть была предельно простая: игрок запускал птиц из рогатки и разрушал постройки, где прятались свиньи, укравшие их яйца. Врагами  зеленых свиней сделали не случайно: в тот год весь мир обсуждал эпидемию свиного гриппа. Вскоре свиной грипп позабыли, а набрала невероятную популярность игра продержалась на вершине еще годы: уже в 2012-м Angry Birds стала первой мобильной игрой, которую скачали миллиард раз.</p></section><section class="museum-text-programme"><h3>«Спокойной ночи, малыши!»</h3><p>В нулевые у «Спокойной ночи, малыши!» было время перемен. В 2002 году передача переехала на телеканал «Россия», ведущей стала Анна Михалкова, а к Хрюше, Степашке, Филе и Каркуше присоединился медвежонок Мишутка. Через год еще одной ведущей стала Оксана Федорова — победительница конкурса «Мисс Вселенная — 2002». В 2002-м также вернули пластилиновую заставку Александра Татарского — только теперь к пластилину добавили современную компьютерную графику. Даже «Спокушки» встретили нулевые облаками, нарисованными на компьютере.</p><p>В том же 2002-м Хрюше впервые за тридцать лет пришлось искать новый голос. После смерти Натальи Державиной, которая озвучивала его с 1970-х, на роль прослушивались сотни актрис. Пока искали ту самую интонацию, Наталья Голубенцева некоторое время играла сразу двух героев — Степашку и Хрюшу. В итоге новым голосом Хрюши стала актриса, заслуженная артистка России Оксана Чабанюк.</p><p>В нулевые герои «Спокойной ночи, малыши!» начали выходить далеко за пределы телевизора. С 2003 года они участвуют в ежегодной благотворительной программе ВТБ «Мир без слез», которая продолжается и в наше время. До сих пор детские больницы по всей стране получают новое оборудование, а герои передачи продолжают ездить по городам России и устраивают спектакли для маленьких пациентов.</p><p>В 2005 году появились настольные игры «Хрюшина азбука», «Степашкина арифметика» и «Каркушин букварик»: с полем, карточками, кубиком и фишками героев дети учились буквам, чтению и счету. А к концу десятилетия вышла уже целая серия обучающих игр-тренажеров — от арифметики и чтения по слогам до памяти и логики.</p><p><a href="https://vkvideo.ru/playlist/-113057035_11" rel="noopener noreferrer">Смотрите «Спокойной ночи, малыши! Ждут друзей» в VK Видео</a></p></section></section><section class="museum-text-era" id="era-3"><h2>2010-е</h2><p>Время, когда интернет окончательно переезжает в карман. У ребенка появляется своя полноценная жизнь в сети: аватарка, лента, лайки, подписчики, сторис и любимые блогеры. То, что раньше происходило во дворе и к вечеру исчезало, теперь можно снять, выложить и разослать друзьям — сохранить и пересматривать каждый день.</p><figure class="museum-text-expert"><figcaption><h3>Анна Гребенникова</h3><p>Историк, социальный антрополог</p></figcaption><blockquote><p>Привычные детские практики перешли в цифровое пространство: аватарки, мемы и фильтры выполняют ту же функцию, что раньше вкладыши, — по ним узнают «своих». Резко возрастает скорость моды, а вместе с ней роль социального одобрения: важно находиться в одном информационном поле с друзьями.</p></blockquote></figure><figure class="museum-text-expert"><figcaption><h3>Наталья Кисельникова</h3><p>Кандидат психологических наук</p></figcaption><blockquote><p>Это детство с постоянной обратной связью. Реакция окружающих доступна круглосуточно, измеряется в лайках и подписчиках и сохраняется. Подростковая задача прежняя — понять, кто ты, и убедиться, что тебя принимают, — но сравнивать себя теперь можно с неограниченным числом людей.</p><p>Поэтому важно не время, проведенное в телефоне, а то, чем ребенок там занят. Час просмотра смешных видео с животными и час сравнения себя с каким-то успешным блогером из интернета имеют для психики разные последствия.</p></blockquote></figure><section class="museum-text-object"><h3>«Маша и Медведь»</h3><p>Сериал вышел в самом начале 2009 года, но настоящим десятилетием «Маши» стали десятые. Премьера, кстати, тоже прошла в «Спокойной ночи, малыши!» — 7 января 2009 года. Идея появилась еще в 1996-м, а одну только первую серию делали около восьми месяцев. Через несколько лет неугомонную девочку и терпеливого Медведя, бывшего циркового артиста, узнавали уже по всему миру, а серия «Маша + каша» попала в Книгу рекордов Гиннесса как один из самых просматриваемых мультфильмов в интернете.</p></section><section class="museum-text-object"><h3>«Фиксики»</h3><p>Еще одни выпускники «Спокушек»: в 2010 году первые серии показали прямо в передаче. Основой стала повесть Эдуарда Успенского «Гарантийные человечки» 1974 года — про крошечных мастеров, которые живут внутри техники и чинят ее, пока не кончилась гарантия. Успенский, к слову, был и автором легендарной пластилиновой заставки, так что круг замкнулся. Заодно мультфильм объяснял детям, как устроены пылесос, холодильник и магнит, — заметно увлекательнее школьного учебника.</p></section><section class="museum-text-object"><h3>Селфи-палка</h3><p>Предок селфи-палки запатентовали в Японии еще в 1983 году, а в 1995-м похожее устройство попало в книгу «101 бесполезное японское изобретение». Через двадцать лет над ним уже никто не смеялся: в 2015 году селфи-палки были повсюду, а Третьяковская галерея решила их запретить — посетители пятились ради кадра и рисковали задеть экспонаты.</p></section><section class="museum-text-object"><h3>Фронтальная камера и маски</h3><p>Первая коммерческая фронтальная камера появилась еще в 1999 году — ее действительно придумали в том числе для видеозвонков. Но в десятые назначение резко изменилось: фронталка стала прежде всего камерой для себя. А потом к селфи добавились маски и фильтры: лицо можно было превратить в морду кота, зомби или кого угодно еще до того, как нажмешь кнопку съемки.</p></section><section class="museum-text-object"><h3>Видеоблогеры</h3><p>В десятые у детей появились собственные звезды — не из телевизора, а из интернета. Видеоблогер не пел со сцены и не снимался в кино: он включал камеру у себя в комнате, проходил игры, смотрел смешные видео, отвечал подписчикам и рассказывал, что случилось за день. Именно этим и подкупал: по ту сторону экрана как будто сидела не знаменитость, а старший друг. Новый ролик обсуждали на перемене так же, как когда-то вчерашний мультфильм, а в списке профессий мечты рядом с врачом и космонавтом впервые появился блогер.</p></section><section class="museum-text-object"><h3>Стримы</h3><p>Видеоблогами к концу десятых уже никого было не удивить. А вот стримы изменили саму механику создания контента в сети: ролик больше не нужно было записывать и монтировать — можно было выйти в прямой эфир, играть и одновременно разговаривать со зрителями. В России одни из первопроходцев стриминга стал блогер Илья Мэддисон, который начала проводить прямые трансляции еще в 2013 году — за ним закрепился неофициальный статус «короля» всего Рунета.</p></section><section class="museum-text-object"><h3>Мемы</h3><p>В десятые мемы превратились из смешных картинок в отдельный язык. Одной знакомой рожицы уже хватало, чтобы ответить на сообщение или описать целую ситуацию. У Рунета появилась собственная хронология: так, в 2015-м все добавляли в конец фразы «Карл!», в 2016-м коту в колпаке пририсовали волшебную палочку — и появился «Вжух», а в 2017-м голландская скульптура человека, ждущего приема у врача, стала российским Ждуном. В 2010-е мемы стали настоящим символом эпохи.</p></section><section class="museum-text-object"><h3>Портативная Bluetooth-колонка</h3><p>Название Bluetooth вообще должно было быть временным. Инженер Intel предложил его в честь датского короля Харальда Синезубого, который объединял земли, — новая технология тоже должна была соединять разные устройства. Даже знаменитый значок Bluetooth — это две соединенные скандинавские руны, инициалы Харальда. В десятые технология дала возможность включать музыку на весь двор — уже без проводов.</p></section><section class="museum-text-object"><h3>Спиннер</h3><p>Весной 2017 года спиннеры - вращающиеся игрушки с подшипником в центре и лопастями вокруг - за несколько месяцев оказались буквально везде. Масштаб увлечения дошел до того, что Роспотребнадзор отдельно изучил, действительно ли игрушка помогает детям успокоиться и сконцентрироваться. Выраженного полезного или вредного эффекта специалисты не нашли и предположили, что мода быстро пройдет. В этом прогнозе они не ошиблись.</p></section><section class="museum-text-object"><h3>Слайм</h3><p>Слайм, или лизун, — мягкая тянущаяся масса, которую можно мять, растягивать, складывать и снова собирать в комок. Но в конце десятых куда интереснее было сделать ее самому: из клея, красителя, пены для бритья и других ингредиентов. В 2018 году Роспотребнадзор даже писал о массовом увлечении школьников слаймами: дети придумывали собственные рецепты, снимали процесс и даже продавали свои смеси.</p></section><section class="museum-text-object"><h3>VR-шлем</h3><p>В середине десятых виртуальная реальность наконец перестала быть штукой из фантастических фильмов. Шлем закрывал глаза экраном и отслеживал движение головы, поэтому человек мог буквально оглядываться внутри игры. Для большинства семей такая техника оставалась слишком дорогой, зато VR быстро поселился в игровых клубах и торговых центрах: будущее можно было не покупать, а взять на несколько минут напрокат.</p></section><section class="museum-text-object"><h3>Мини-штатив</h3><p>Гибкий GorillaPod появился еще в 2006 году: его ножки можно было обмотать вокруг ветки, перил или спинки стула. Но по-настоящему пригодился он уже в десятые, когда камера переехала в смартфон, а снимать себя стало обычным делом. Телефон больше не нужно было кому-то вручать — его можно было поставить почти где угодно, отойти на пару шагов и самому оказаться в кадре.</p></section><section class="museum-text-programme"><h3>«Спокойной ночи, малыши!»</h3><p>К своему 50-летию в 2014 году «Спокойной ночи, малыши!» целый год искали нового героя. Им мог стать волчонок, но он слишком напоминал Волка из «Ну, погоди!». Среди других кандидатов были обезьянка и жираф. Но в итоге выбрали амурского тигренка Мура — идея появилась на фоне проектов по защите редких животных.</p><p>Мур стал первым постоянным героем программы, созданным с помощью 3D-анимации: над ним работали специалисты из Екатеринбурга, Еревана и Лондона. Через несколько лет для студийных съемок создали кукольного Мура, и он занял место рядом с Хрюшей, Степашкой, Филей и Каркушей. А его игрушечная копия еще в 2014 году успела слетать на МКС вместе с космонавтом Еленой Серовой.</p><p>В 2016 году у вечерней программы появилась утренняя сестра — «С добрым утром, малыши!». Песню для заставки написал Сергей Шнуров  — причем бесплатно, в подарок программе. Сам он надеялся только на одно: что дети не испугаются его рычащего вокала, напоминающего Бармалея.</p><p>В год 55-летия программы Хрюша освоил еще одну профессию: в финале детского «Евровидения — 2019» он второй раз подряд объявил баллы российского жюри. И в честь юбилея ГУМ на Красной площади украсили в стиле «Спокойной ночи, малыши!».</p><p><a href="https://vkvideo.ru/playlist/-113057035_11" rel="noopener noreferrer">Смотрите «Спокойной ночи, малыши! Ждут друзей» в VK Видео</a></p></section></section><section class="museum-text-era" id="era-4"><h2>2020-е</h2><p>Сегодняшнее детство уже не помещается в одну коробку с игрушками. Даже в две. Pop It мнется в руках, Labubu болтается на рюкзаке, в Roblox тратятся робуксы, для игровых персонажей покупаются скины, а в Minecraft строятся целые миры. Любимые блогеры и стримеры давно конкурируют с мультгероями, дети снимают короткие видео, пересылают друг другу мемы и придумывают персонажей вместе с нейросетями.</p><p>Через двадцать лет кто-нибудь наверняка посмотрит на сегодняшний Pop It с тем же чувством, с каким мы сейчас смотрим на тамагочи.</p><figure class="museum-text-expert"><figcaption><h3>Анна Гребенникова</h3><p>Историк, социальный антрополог</p></figcaption><blockquote><p>Игрушка или формат за несколько дней распространяются по всему миру. Граница между цифровым и материальным стала подвижной, но потребность потрогать, собрать и обменять никуда не исчезла. Главное изменение в том, что ребенок стал не только потребителем, но и производителем контента.</p><p>Социальная логика детства при этом узнаваема: детям по-прежнему нужно собственное пространство, только теперь оно складывается не только во дворе, но и в чатах, играх и онлайн-сообществах.</p></blockquote></figure><figure class="museum-text-expert"><figcaption><h3>Наталья Кисельникова</h3><p>Кандидат психологических наук</p></figcaption><blockquote><p>Ребенок впервые получил почти неограниченный выбор, а вместе с ним задачу, к которой человек плохо приспособлен: самому решать, когда остановиться. Выбор помогает найти свое, но общий культурный код распадается, и общий опыт, ритуалы и традиции в семье все чаще приходится создавать намеренно. При этом дети не разучились скучать. Просто раньше скука подталкивала их искать какое-то занятие, а сейчас практически каждая пауза всегда чем-то заполнена.</p></blockquote></figure><section class="museum-text-object"><h3>Детские смарт-часы</h3><p>Первые модели с GPS и геозонами появились еще в середине 2010-х, а теперь детские смарт-часы стали почти обязательным гаджетом младшего школьника. С них можно позвонить родителям или нажать SOS, а взрослые видят местоположение ребенка, его маршрут и получают уведомление, если он вышел из заданной зоны. Получился удобный промежуточный этап: ребенок уже сам идет из школы или гуляет во дворе, а родитель может одним глазом следить за ним на карте.</p></section><section class="museum-text-object"><h3>Поп-ит</h3><p>Принцип поп-ита придумали еще в 1975 году, но настоящая истерия началась весной 2021-го. Пандемия очень удачно совпала с интересом к игрушке, которую можно бесконечно щелкать дома, использовать как антистресс и снимать крупным планом: в соцсетях быстро добавил ASMR с поп-ит, челленджи, игры и обмены. Через несколько недель поп-иты и симпл-димплы были уже в российских школах и родительских чатах повсеместно — а взрослым срочно пришлось выяснять, что означают эти два слова.</p></section><section class="museum-text-object"><h3>«Чебурашка»</h3><p>Самым кассовым фильмом в истории российского проката оказался не боевик и не блокбастер, а история про ушастого зверька из ящика с апельсинами. «Чебурашка» вышел 1 января 2023 года, меньше чем за две недели обошел даже первый «Аватар» и в итоге собрал около 6,7 миллиарда рублей. На один и тот же фильм шли бабушки, помнившие кукольного Чебурашку, их дети и внуки, для которых он теперь пушистый и почти настоящий. А «Чебурашка 2» в 2026 году поставил новый рекорд: три миллиарда рублей за первые пять дней проката.</p></section><section class="museum-text-object"><h3>Короткие вертикальные видео</h3><p>Телефон перестали поворачивать боком. Ролик на полминуты снимают одной рукой, монтируют прямо в телефоне и листают пальцем вверх, пока не закончится перемена. Только у клипов в VK дневная аудитория уже в 2023 году превышала 25 миллионов человек. Для детей это одновременно телевизор, мемы и сарафанное радио: танцы, челленджи, рецепты слаймов и распаковки разлетаются по стране за пару дней. Главный навык поколения — за первые две секунды понять, стоит ли досматривать.</p></section><section class="museum-text-object"><h3>GRWM</h3><p>GRWM — Get Ready With Me — превратил обычные сборы в самостоятельный жанр. Камера включается, пока ребенок или подросток выбирает одежду, делает прическу или красится, но сами сборы часто оказываются просто фоном: за это время можно рассказать про школу, друзей, ссору или влюбленность. Получился почти видеодневник, только тут ты разговариваешь с людьми, пока ищешь вторую сережку. И жанр уже давно перерос макияж: так собираются в школу, на тренировку и в лагерь.</p></section><section class="museum-text-object"><h3>Таба-лапки</h3><p>В 2024 году российские школьники массово увлеклись таба-лапками — мягкими липкими игрушками в форме кошачьей лапы. Их собирают, украшают, меняют, снимают с ними ролики, а главное — запускают в стены и потолок, к которому лапка прекрасно прилипает. Так довольно быстро появился отдельный вид школьной археологии: доставать чужие таба-лапки из-под потолка.</p></section><section class="museum-text-object"><h3>Кроксы с джиббитсами</h3><p>Джиббитсы придумала мама троих детей Шери Шмельц, когда ее семья начала вставлять маленькие украшения в дырки на Crocs; уже через год Crocs купила их бизнес за десять миллионов долларов. В 2020-х кроксы снова взлетели благодаря соцсетям, коллаборациям и именно этой возможности собрать обувь под себя. Для детей это практически конструктор на ногах: сегодня там Minecraft, завтра любимая еда, буквы имени или персонажи из мультфильма — а потом все можно снять и собрать заново.</p></section><section class="museum-text-object"><h3>Лабубу и обвесы на рюкзак</h3><p>Лабубу придумали еще в 2015 году, но мировой бум начался в 2024-м: игрушки стали носить на сумках знаменитости, а соцсети сделали остальное. Добавилась механика blind box — до открытия коробки неизвестно, какая фигурка внутри, поэтому одной обычно не заканчивается: редких ищут, повторками меняются, распаковки снимают. И Лабубу отлично попал в более широкую моду на обвесы: рюкзак теперь снова можно покрыть брелоками и игрушками почти до полного исчезновения самого рюкзака.</p></section><section class="museum-text-object"><h3>Скины и робуксы</h3><p>У современной детской вещи может вообще не быть физического тела. Скин, новая прическа, питомец или аксессуар существуют только внутри игры, но на них копят, ими гордятся, их просят в подарок и хвастаются ими друзьям. Особенно хорошо это видно в Roblox с его собственной валютой — робуксами: у детей появилась настоящая коллекция имущества, которую невозможно высыпать из карманов. Roblox до до сих пор остается одной из самых популярных игровых площадок среди российских детей.</p></section><section class="museum-text-object"><h3>ИИ</h3><p>Нейросеть для ребенка уже не выглядит «технологией будущего»: российские школьники используют ее для домашки и поиска информации, просят объяснить непонятную тему, придумать идею, текст или картинку. По данным «Лаборатории Касперского», нейросетями пользуется большинство российских школьников 12–17 лет, причем многие обращаются к ним несколько раз в неделю или ежедневно. Впервые рядом с ребенком появился собеседник, который одновременно умеет объяснять дроби, сочинять историю про капибару и не говорит, что ему сейчас некогда.</p></section><section class="museum-text-object"><h3>Брейнрот</h3><p>Тралалеро Тралала, Балерина Капучина, Бомбардиро Крокодило и десятки других абсурдных персонажей появились из нейросетевых картинок и коротких роликов в 2025 году. Почти сразу дети начали придумывать собственных героев, а мемы перебрались в Roblox: Steal a Brainrot, где персонажей нужно собирать и красть друг у друга, на пике одновременно запустили больше 24 миллионов человек. А следом брейнроты уже появились на карточках, наклейках, брелоках и игрушках — сегодня путь от бессмысленного мема до вещи в детском рюкзаке иногда занимает всего несколько месяцев.</p></section></section><section class="museum-text-final"><h2>«Спокушки» сегодня</h2><p>За шестьдесят с лишним лет детство несколько раз полностью сменило медиасреду. Телевизор с ручками уступил место домашнему компьютеру, компьютер — смартфону, телепрограмма — бесконечной ленте видео. Несмотря на перемены, «Спокойной ночи, малыши!» удалось не только воспитать сразу несколько поколений, но и сохранить ту неповторимую атмосферу, знакомую каждому ребенку и взрослому нашей страны.</p><p>Во время ковида «Спокушки» продолжали выходить и снова собирали у телевизора всю семью: дети ждали знакомых героев, а родители смотрели вместе с ними передачу, на которой выросли сами.</p><p>В 2024 году «Спокойной ночи, малыши!» исполнилось 60 лет. А в 2026-м у передачи появилось новое продолжение — проект «Спокойной ночи, малыши! Ждут друзей» в VK Видео Детям.</p><p>Теперь в гости к Филе, Степашке, Хрюше и Каркуше приходят герои уже другого детского медиамира — популярные блогеры. Вместе они разговаривают с детьми о сне, дружбе, привычках и других важных вещах, играют, а в конце по-прежнему смотрят мультфильм и желают зрителям спокойной ночи.</p><p>Экран изменился, выпуск можно включить тогда, когда удобно, а рядом с героями, которых помнят родители, появляются люди, которых их дети привыкли смотреть в интернете. Среди них — Милана Хаметова, Богдан Луномосик, Василиса Кукояка, Аня Дабл Бабл, Камиль Kikido и Капуки Кануки. Но сама идея остается прежней — закончить день знакомым семейным ритуалом: посмотреть передачу и пойти спать.</p><p>По исследованию VK Видео и Lady Mail, больше 80 процентов опрошенных взрослых сами смотрели передачу в детстве, а 44 процента уже познакомили с ней своих детей. Это много говорит о феномене «Спокойной ночи, малыши!» —  родители и дети из разных поколений могут одинаково ностальгировать, помнить одних и тех же Хрюшу и Степашку, хотя росли уже в совершенно разных медиамирах.</p><p>Теперь у этого феномена появилась еще одна форма. В «Спокойной ночи, малыши! Ждут друзей» встречаются герои, которых помнят родители, и те, кого сегодня знают и любят дети. Для музея детства это очень подходящий последний экспонат: игрушки, экраны и кумиры меняются, а пожелание спокойной ночи переезжает на новый экран.</p><figure class="museum-text-expert"><figcaption><h3>Александр Митрошенков</h3><p>Председатель Совета директоров «Спокойной ночи, малыши!»</p></figcaption><blockquote><p>В мире больше нет ни одного примера детской телепрограммы, которая выходила бы в эфир больше 60 лет. В чем же главная особенность «Спокойной ночи, малыши!»? Дело в том, что при создании программы у творческой команды не было стереотипов и аксиом, на которые бы они полагались. Поначалу кукольными героями должны были стать Буратино, Тёпа, Шустрик, Мямлик и другие театральные персонажи. Но быстро стало ясно, что они недостаточно увлекают маленьких зрителей. Тогда и появилась легендарная четверка: Хрюша, Степашка, Филя и Каркуша. Каждый из них — часть собирательного образа современного ребенка: Хрюша — веселый и хулиганистый, Степашка — скромный и начитанный, Филя — справедливый и добрый, а Каркуша — умная и, как единственная девочка, неисправимая модница. То же и с названием программы. Отметали все, что не подходит, пока не нашли то самое — «Спокойной ночи, малыши!», — которое легло в культурный код миллионов российских телезрителей. Если что-то хоть немного не отвечало запросам юных телезрителей, это сразу меняли.</p><p>Например, когда стало понятно, что проекту не хватает вечернего эфира, возникло его утреннее продолжение — «С добрым утром, малыши!». Конечно, решение о том, что музыку к заставке должен написать Сергей Шнуров, известный своими провокационными хитами, встретили неоднозначно. Но новое поколение детей требовало смелого подхода: другого темпа музыки, современного композитора и как итог  — родился трек, под который дети с радостью просыпаются каждое утро вот уже десять лет. Многое в проект вносят сами дети. Как появились специальные выпуски обучающих программ с героями «Спокойной ночи, малыши!»? Стали приходить письма от родителей с просьбой коснуться более сложных тем. В ответ мы создали отдельный образовательный цикл передач, а несколько лет назад запустили рубрику «Финансовая азбука» потому что нынешнее поколение активно осваивает финансовую грамотность, что, конечно, было совершенно не актуально для 1960-х.</p><p>Все это — показатель системы постоянного самосовершенствования программы на каждом этапе ее существования. Возьмем ведущих телепрограммы: каждому поколению зрителей — свои. Например, в нулевых мы получали много писем, где сквозила тема неполной семьи: и мальчикам, и девочкам не хватало в доме авторитета отца. Тогда в роли ведущих детской передачи стали выступать известные актеры Сергей Безруков и Михаил Пореченков — с уникальной палитрой голосов, мужским характером, и что немаловажно, собственным опытом отцовства. Такой подход позволяет двигаться проекту вперед, в том числе, меняя наполнение программы. Неслучайно в числе авторов и сценаристов в разное время оказывались самые талантливые детские писатели — Эдуард Успенский, Андрей Усачев, Александр Курляндский и многие другие.</p><p>Коллектив «Спокойной ночи малыши!» — это большая творческая семья. Но при этом ни у кого из них нет права «застывать в прошлом», все меняется и наш проект меняется вместе с детьми. Есть много примеров телепередач, которые потеряли динамику, остановились и не сумели двигаться вперед. Сегодня, когда детский контент производят блогеры с миллионной аудиторией в соцсетях, мы не можем это игнорировать. В новом проекте «Спокойной ночи, малыши! Ждут друзей» мы постарались сохранить ритуал семейного просмотра нашей программы и навести мосты между поколением бабушек и дедушек, мам и пап, которые много лет доверяют нашим кукольным героям, и современными детьми, чье внимание захватили популярные блогеры. Мы объединили классические ценности, на которых растет уже четвертое или пятое поколение зрителей, и новые модные веяния. Поэтому вовсе неудивительно, что наши коллекции футболок, свитшотов или пижам с героями программы и смешными надписями одинаково готовы носить и взрослые, и малыши. Умение оставаться на одной волне с новым поколением детей и постоянное самосовершенствование со способностью сохранить место для прежних ценностей, на мой взгляд, и являются тем мощным двигателем, который лежит в основе программы «Спокойной ночи, малыши!», ее национальном и культурном феномене.</p></blockquote></figure><p><a href="https://vkvideo.ru/playlist/-113057035_11" rel="noopener noreferrer">Смотрите «Спокойной ночи, малыши! Ждут друзей» в VK Видео</a></p></section></article><!-- museum-text:end --></noscript>
